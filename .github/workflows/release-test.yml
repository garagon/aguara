name: Release packaging validation

on:
  pull_request:
    branches: [main]
    paths:
      - ".goreleaser.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-test.yml"
      - "go.mod"
      - "go.sum"

permissions:
  contents: read

concurrency:
  group: release-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOMAXPROCS: "2"
      GOMEMLIMIT: "1GiB"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: go.sum

      # Match the release installer's verification path, without signing outputs.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v2.6.3"

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Build release snapshot without signing or publishing
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish,sign --parallelism=2 --timeout=15m

      - name: Verify archives and checksums
        shell: bash
        run: |
          shopt -s nullglob
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              extension=tar.gz
              if [ "$os" = windows ]; then extension=zip; fi
              files=(dist/aguara_*_${os}_${arch}.${extension})
              test "${#files[@]}" = 1
              test -s "${files[0]}"
            done
          done
          cd dist
          sha256sum --check checksums.txt

      - name: Verify SBOMs and run the native archive
        shell: bash
        run: |
          shopt -s nullglob
          sboms=(dist/*.sbom.json)
          test "${#sboms[@]}" = 6
          for sbom in "${sboms[@]}"; do
            jq -e '.spdxVersion | startswith("SPDX-")' "$sbom"
          done
          mkdir -p "$RUNNER_TEMP/release-smoke"
          tar -xzf dist/aguara_*_linux_amd64.tar.gz -C "$RUNNER_TEMP/release-smoke"
          "$RUNNER_TEMP/release-smoke/aguara" --no-update-check version
          "$RUNNER_TEMP/release-smoke/aguara" scan --no-update-check --ci \
            --workers 1 --format json .github/test-fixtures/clean > "$RUNNER_TEMP/release-clean.json"
          jq -e '(.findings // []) | length == 0' "$RUNNER_TEMP/release-clean.json"
