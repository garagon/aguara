name: Test Action

on:
  pull_request:
    branches: [main]
    paths:
      - "action.yml"
      - ".github/workflows/test-action.yml"

permissions:
  security-events: write

concurrency:
  group: test-action-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-action:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"

      - name: Run Aguara action (default — SARIF)
        id: scan
        uses: ./
        with:
          path: ./internal/rules/builtin/
          severity: medium
          # Build the binary from the same exact commit as action.yml.
          install-script-ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify outputs
        shell: bash
        env:
          FINDINGS: ${{ steps.scan.outputs.findings-count }}
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
        run: |
          echo "Findings: $FINDINGS"
          echo "Exit code: $EXIT_CODE"
          if [ -z "$FINDINGS" ]; then
            echo "::error::findings-count output is empty"
            exit 1
          fi

      - name: Verify SARIF file exists
        run: |
          if [ ! -f aguara-results.sarif ]; then
            echo "::error::SARIF file not created"
            exit 1
          fi
          jq '.runs[0].tool.driver.name' aguara-results.sarif

  test-action-json:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"

      - name: Run Aguara action (JSON, no SARIF upload)
        id: scan
        uses: ./
        with:
          path: ./internal/rules/builtin/
          format: json
          output: results.json
          upload-sarif: 'false'
          # Build the binary from the same exact commit as action.yml.
          install-script-ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify JSON output
        run: |
          if [ ! -f results.json ]; then
            echo "::error::JSON file not created"
            exit 1
          fi
          jq '.summary' results.json

  test-action-fail-on:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"

      - name: Run Aguara action (fail-on critical, clean fixture, expect exit 0)
        uses: ./
        with:
          path: ./.github/test-fixtures/clean/
          fail-on: critical
          upload-sarif: 'false'
          # Build the binary from the same exact commit as action.yml.
          install-script-ref: ${{ github.event.pull_request.head.sha || github.sha }}

  test-action-untrusted-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"

      - name: Run Aguara action against a self-suppressing repository
        id: scan
        continue-on-error: true
        uses: ./
        with:
          path: ./.github/test-fixtures/untrusted-policy/
          fail-on: high
          format: json
          output: untrusted-policy-results.json
          upload-sarif: 'false'
          install-script-ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify target policy cannot bypass the action
        if: always()
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::target-owned policy bypassed the Aguara action"
            exit 1
          fi
          if ! jq -e '.findings | any(.rule_id == "PROMPT_INJECTION_001")' untrusted-policy-results.json >/dev/null; then
            echo "::error::action failed without reporting the expected prompt-injection finding"
            exit 1
          fi
